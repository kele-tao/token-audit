[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "token-audit"
version = "1.0.0"
description = "Find wasted tokens and model spend in prompts, tool schemas and chat logs, then optimise them with verifiable before/after deltas. Pure Python, no API calls."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "kele" }]
keywords = ["llm", "tokens", "finops", "optimization", "cost", "prompt-engineering"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5"]

[project.scripts]
token-audit = "token_audit.cli:main"

[project.urls]
Homepage = "https://github.com/kele-tao/token-audit"
Issues = "https://github.com/kele-tao/token-audit/issues"
Changelog = "https://github.com/kele-tao/token-audit/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
token_audit = ["data/*.bin", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
extend-exclude = ["scratch", "out"]
target-version = "py310"
src = ["src", "tests", "scripts", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "SIM", "C4", "RUF"]
ignore = ["E501", "SIM108", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]
"benchmarks/*" = ["E501"]